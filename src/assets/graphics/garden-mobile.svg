<svg xmlns="http://www.w3.org/2000/svg" width="600" height="580" viewBox="0 0 600 580" fill="none">
<title>Китайский сад MinMin — композиция для телефона</title>
<desc>Компактная векторная панорама: бамбук с двух сторон, фонарь, три облака, горы, ручей с мостиком, павильон, книга, чашка, кисть и цветы.</desc>
